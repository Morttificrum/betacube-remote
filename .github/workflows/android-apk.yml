name: Beta Cube Remote - APK Android (arm64, assinado)

# Build isolado do Android. NAO toca no build do Windows. Compila o fork Beta Cube
# (nunca o RustDesk oficial) e assina com a chave propria da Beta Cube
# (secrets BC_ANDROID_KEYSTORE_B64 / BC_ANDROID_KEYSTORE_PASSWORD). O APK sai como
# artifact do run (nao publica release publica).

on:
  workflow_dispatch:
  push:
    branches: [android-apk]
    paths: [".github/workflows/android-apk.yml"]

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VERSION: "1.4.8"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  apk:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    steps:
      - uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
            libayatana-appindicator3-dev libasound2-dev libc6-dev libclang-dev libunwind-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libpam0g-dev \
            libpulse-dev libva-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build openjdk-17-jdk-headless \
            pkg-config tree wget

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      # Correcao da falha de outubro: o Gradle baixava o SDK do Android durante o build
      # e o zip vinha truncado (instabilidade do GitHub). Pre-instalamos com retry.
      - name: Pre-install Android SDK pieces (retry)
        shell: bash
        run: |
          SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          for i in 1 2 3 4; do
            if "$SDKM" "platforms;android-34" "platforms;android-33" "build-tools;34.0.0"; then break; fi
            echo "tentativa $i falhou, repetindo"; rm -rf /usr/local/lib/android/sdk/.temp; sleep 20
          done

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (arm64-v8a)
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: aarch64-linux-android

      - name: Build core lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ./target/aarch64-linux-android/release/libbetacube_core.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

      - name: Build APK (assinado Beta Cube)
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          KS_B64: ${{ secrets.BC_ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.BC_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          echo "$KS_B64" | base64 -d > ./flutter/android/app/betacube-release.jks
          {
            echo "storeFile=betacube-release.jks"
            echo "storePassword=$KS_PW"
            echo "keyPassword=$KS_PW"
            echo "keyAlias=betacube"
          } > ./flutter/android/key.properties
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cd flutter
          for i in 1 2 3; do
            if flutter build apk --release --target-platform android-arm64 --split-per-abi; then ok=1; break; fi
            echo "build falhou (tentativa $i), repetindo"; rm -rf /usr/local/lib/android/sdk/.temp; sleep 20
          done
          [ "${ok:-0}" = 1 ]
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../out/BetaCubeRemote.apk
          rm -f ./android/key.properties ./android/app/betacube-release.jks

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BetaCubeRemote-apk
          path: out/BetaCubeRemote.apk
