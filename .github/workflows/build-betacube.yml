name: Build Beta Cube Remote Installer

on:
  workflow_dispatch:
    inputs:
      fork_tag:
        description: "Tag do release do build-fork.yml (deixe vazio pra usar o binário oficial do RustDesk sem nosso rebrand de código)"
        type: string
        default: ""
  push:
    tags:
      - 'betacube-*'

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download our fork build
        if: ${{ inputs.fork_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.fork_tag }}" --repo ${{ github.repository }} --pattern "rustdesk-*-x86_64.exe" --dir .
          $exe = Get-ChildItem -Filter "rustdesk-*-x86_64.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Nenhum exe x86_64 encontrado no release ${{ inputs.fork_tag }}"; exit 1 }
          Move-Item -Force $exe.FullName rustdesk.exe
          Write-Host "Usando build do fork: $($exe.Name)"

      - name: Download RustDesk binary (oficial, sem nosso rebrand de código)
        if: ${{ inputs.fork_tag == '' }}
        shell: pwsh
        run: |
          $version = "1.3.8"
          $url = "https://github.com/rustdesk/rustdesk/releases/download/$version/rustdesk-$version-x86_64.exe"
          Write-Host "Downloading RustDesk $version..."
          Invoke-WebRequest -Uri $url -OutFile "rustdesk.exe" -UseBasicParsing
          Write-Host "Download complete: $(Get-Item rustdesk.exe | Select-Object -ExpandProperty Length) bytes"

      - name: Create installer output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "installer\output" -Force

      - name: Build NSIS installer
        shell: pwsh
        run: |
          # NSIS is pre-installed on windows-latest runners
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisPath)) {
            Write-Host "NSIS not found at default path, searching..."
            $nsisPath = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          }
          if (-not $nsisPath) {
            choco install nsis -y --no-progress
            $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          Write-Host "Using NSIS at: $nsisPath"
          & $nsisPath /V3 installer\betacube-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer built successfully!"
          Get-Item "installer\output\BetaCubeRemote-Setup.exe" | Select-Object Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetaCubeRemote-Windows-Setup
          path: installer/output/BetaCubeRemote-Setup.exe
          retention-days: 90
          if-no-files-found: error
