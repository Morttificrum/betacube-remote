name: Build Beta Cube Remote Installer

on:
  workflow_dispatch:
    inputs:
      fork_tag:
        description: "Tag do release do build-fork.yml (deixe vazio pra usar o binário oficial do RustDesk sem nosso rebrand de código)"
        type: string
        default: ""
      store_name:
        description: "Nome da loja/cliente (opcional) -- gera betacube-remote-<NOME>-setup.exe com a tag já embutida, em vez do instalador genérico"
        type: string
        default: ""
  push:
    tags:
      - 'betacube-*'

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Usamos o .msi (não o .exe portátil do release) de propósito: o .exe
      # portátil é um stub autoextraível (libs/portable/src/main.rs) que
      # SEMPRE extrai/roda o app de verdade a partir de um caminho fixo
      # (%LOCALAPPDATA%\rustdesk, hardcoded, ignora nosso APP_NAME) e depois
      # o --install copia tudo de volta com os nomes originais -- foi a causa
      # raiz real do "instala sem erro mas não abre nada". O .msi contém a
      # build "crua" do Flutter (RustDesk.exe pequeno + DLLs ao lado, sem
      # esse wrapper), extraída via `msiexec /a` (instalação administrativa,
      # só copia arquivo, não precisa admin/UAC).
      - name: Download our fork build
        if: ${{ inputs.fork_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.fork_tag }}" --repo ${{ github.repository }} --pattern "rustdesk-*-x86_64.msi" --dir .
          $msi = Get-ChildItem -Filter "rustdesk-*-x86_64.msi" | Select-Object -First 1
          if (-not $msi) { Write-Error "Nenhum msi x86_64 encontrado no release ${{ inputs.fork_tag }}"; exit 1 }
          Write-Host "Usando build do fork: $($msi.Name)"
          & .github\scripts\extract-rustdesk-msi.ps1 -MsiPath $msi.FullName

      - name: Download RustDesk binary (oficial, sem nosso rebrand de código)
        if: ${{ inputs.fork_tag == '' }}
        shell: pwsh
        run: |
          $version = "1.3.8"
          $url = "https://github.com/rustdesk/rustdesk/releases/download/$version/rustdesk-$version-x86_64.msi"
          Write-Host "Downloading RustDesk $version..."
          Invoke-WebRequest -Uri $url -OutFile "rustdesk.msi" -UseBasicParsing
          & .github\scripts\extract-rustdesk-msi.ps1 -MsiPath "$PWD\rustdesk.msi"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build hwsensor-helper (Fase 3)
        shell: pwsh
        run: |
          dotnet publish native\hwsensor-helper -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o .
          Get-Item "hwsensor-helper.exe" | Select-Object Name, Length

      - name: Create installer output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path "installer\output" -Force

      - name: Build NSIS installer
        shell: pwsh
        run: |
          # NSIS is pre-installed on windows-latest runners
          $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsisPath)) {
            Write-Host "NSIS not found at default path, searching..."
            $nsisPath = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          }
          if (-not $nsisPath) {
            choco install nsis -y --no-progress
            $nsisPath = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          Write-Host "Using NSIS at: $nsisPath"

          $storeArg = @()
          $rawStoreName = "${{ inputs.store_name }}"
          if ($rawStoreName -ne "") {
            # NSIS não sanitiza nada disso sozinho -- só alfanumérico/hífen, sem
            # acento/espaço/caractere ilegal em nome de arquivo.
            $storeName = ($rawStoreName -replace '[^A-Za-z0-9-]', '')
            if ($storeName -eq "") { Write-Error "store_name '$rawStoreName' não sobrou nada depois de sanitizar"; exit 1 }
            Write-Host "Loja/cliente: $storeName"
            $storeArg = @("/DSTORE_NAME=$storeName")
          }

          & $nsisPath @storeArg /V3 installer\betacube-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer built successfully!"
          $outFile = Get-ChildItem "installer\output\*.exe" | Select-Object -First 1
          Get-Item $outFile.FullName | Select-Object Name, Length
          echo "installer_path=$($outFile.FullName)" >> $env:GITHUB_ENV
          echo "installer_name=$($outFile.Name)" >> $env:GITHUB_ENV

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.installer_name }}
          path: ${{ env.installer_path }}
          retention-days: 90
          if-no-files-found: error
