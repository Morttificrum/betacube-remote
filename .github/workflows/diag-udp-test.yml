name: Diagnostico temporario -- teste UDP externo
on:
  workflow_dispatch:

jobs:
  udp-test:
    runs-on: ubuntu-latest
    steps:
      - name: IP publico do runner
        run: curl -s https://api.ipify.org
      - name: Manda pacotes UDP de teste
        run: |
          python3 -c "
          import socket, time
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          for i in range(5):
              s.sendto(f'GHACTIONS_PROBE_{i}'.encode(), ('140.238.184.251', 21116))
              print(f'enviado pacote {i}')
              time.sleep(1)
          "
